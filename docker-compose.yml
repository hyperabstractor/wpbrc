# Local run of the CMS + static site (same image Coolify uses).
#   CMS_PASSWORD=dev docker compose up --build
# Then open http://localhost:8080/login  (user: admin / password: from CMS_PASSWORD)

services:
  web:
    build: .
    ports:
      - "8080:8080"
    environment:
      CMS_USER: admin
      CMS_PASSWORD: ${CMS_PASSWORD:-devpassword}
      SESSION_SECRET: ${SESSION_SECRET:-dev-only-change-me}
      CMS_HTTPS: "0"
      PORT: "8080"
    volumes:
      - ./assets:/app/assets
      - ./content:/app/content
      - ./drafts:/app/drafts
      - ./data:/app/data
